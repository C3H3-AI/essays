<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.title }}</title>
<style>
  :root {
    --bg: #faf8f5;
    --fg: #2b2b2b;
    --muted: #8a8a82;
    --accent: #b5651d;
    --line: #e8e3da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Serif SC", serif;
    line-height: 1.85;
    font-size: 17px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 3rem 1.5rem 6rem; }
  header.site { border-bottom: 1px solid var(--line); }
  header.site .wrap { padding-bottom: 1.2rem; border: none; }
  header.site a { color: var(--fg); text-decoration: none; font-weight: 700; font-size: 1.25rem; }
  header.site .desc { color: var(--muted); font-size: .9rem; margin-top: .35rem; }
  h1 { font-size: 1.9rem; line-height: 1.35; margin-top: 0; }
  h2 { margin-top: 2.6rem; border-left: 4px solid var(--accent); padding-left: .7rem; font-size: 1.35rem; }
  h3 { margin-top: 1.8rem; font-size: 1.1rem; }
  p { margin: 1.1rem 0; }
  ul, ol { padding-left: 1.4rem; }
  li { margin: .4rem 0; }
  img { max-width: 100%; height: auto; display: block; margin: 2rem auto; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  blockquote {
    border-left: 3px solid var(--accent);
    margin: 1.6rem 0;
    padding: .6rem 1.1rem;
    color: #555;
    background: #f3efe9;
    border-radius: 0 6px 6px 0;
  }
  hr { border: none; border-top: 1px solid var(--line); margin: 2.8rem 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .post-list { list-style: none; padding: 0; }
  .post-list li { margin: 1.1rem 0; font-size: 1.1rem; }
  .post-date { color: var(--muted); font-size: .85rem; margin-left: .6rem; }
  footer { border-top: 1px solid var(--line); margin-top: 4rem; }
  footer .wrap { padding-top: 1.5rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <div class="desc">{{ site.description }}</div>
</div></header>
<main class="wrap">
  {{ content }}
</main>
<footer><div class="wrap">{{ site.title }} · 由 GitHub Pages 驱动</div></footer>
</body>
</html>
