<svg viewBox="0 0 680 230" width="100%" role="img">
  <title>家的内部生命流</title>
  <desc>感知之肤采集生理签名，送入意识之核由AI家人争论决策，写入记忆之海，最终以主动关怀回应</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text class="th" x="340" y="34" text-anchor="middle">家的内部生命流</text>
  <g class="arr" fill="none" stroke-width="1.5">
    <line x1="172" y1="148" x2="186" y2="148" marker-end="url(#arrow)"/>
    <line x1="322" y1="148" x2="336" y2="148" marker-end="url(#arrow)"/>
    <line x1="472" y1="148" x2="486" y2="148" marker-end="url(#arrow)"/>
  </g>
  <g class="node box">
    <rect x="40" y="120" width="130" height="56" rx="10" stroke-width="0.5"/>
    <text class="th" x="105" y="140" text-anchor="middle" dominant-baseline="central">感知之肤</text>
    <text class="ts" x="105" y="158" text-anchor="middle" dominant-baseline="central">读生理签名</text>
  </g>
  <g class="node c-purple">
    <rect x="190" y="120" width="130" height="56" rx="10" stroke-width="0.5"/>
    <text class="th" x="255" y="140" text-anchor="middle" dominant-baseline="central">意识之核</text>
    <text class="ts" x="255" y="158" text-anchor="middle" dominant-baseline="central">AI 家人争论</text>
  </g>
  <g class="node box">
    <rect x="340" y="120" width="130" height="56" rx="10" stroke-width="0.5"/>
    <text class="th" x="405" y="140" text-anchor="middle" dominant-baseline="central">记忆之海</text>
    <text class="ts" x="405" y="158" text-anchor="middle" dominant-baseline="central">分层 · 跨代</text>
  </g>
  <g class="node box">
    <rect x="490" y="120" width="130" height="56" rx="10" stroke-width="0.5"/>
    <text class="th" x="555" y="140" text-anchor="middle" dominant-baseline="central">主动关怀</text>
    <text class="ts" x="555" y="158" text-anchor="middle" dominant-baseline="central">接住情绪</text>
  </g>
</svg>