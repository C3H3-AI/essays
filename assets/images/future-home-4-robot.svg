  </g>
  <g stroke="#888780" stroke-width="0.5" fill="none">
    <line x1="340" y1="226" x2="116" y2="307"/>
    <line x1="340" y1="226" x2="228" y2="307"/>
    <line x1="340" y1="226" x2="340" y2="307"/>
    <line x1="340" y1="226" x2="452" y2="307"/>
    <line x1="340" y1="226" x2="564" y2="307"/>
  </g>
  <g class="node c-purple">
